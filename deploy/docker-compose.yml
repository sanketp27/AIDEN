version: '3.9'

services:

  mongo:
    image: mongo:7
    container_name: aiden_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: aiden
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiden_network

  workspace-mcp:
    image: python:3.11-slim
    container_name: aiden_workspace_mcp
    working_dir: /app
    command: >
      sh -c "pip install -q google-workspace-mcp fastmcp &&
             python -m google_workspace_mcp"
    environment:
      GOOGLE_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_ENABLED_CAPABILITIES: calendar,gmail,drive,docs
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_TRANSPORT: sse
    ports:
      - "8001:8001"
    networks:
      - aiden_network
    restart: unless-stopped

  mongodb-mcp:
    image: node:20-alpine
    container_name: aiden_mongodb_mcp
    command: >
      sh -c "npx -y @mongodb-js/mongodb-mcp-server --port 8002"
    environment:
      MCP_MONGODB_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MCP_TRANSPORT: sse
      MCP_PORT: 8002
      MCP_MONGODB_READ_ONLY: "true"
    ports:
      - "8002:8002"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - aiden_network
    restart: unless-stopped

  notion-mcp:
    image: node:20-alpine
    container_name: aiden_notion_mcp
    command: >
      sh -c "npx -y @notionhq/notion-mcp-server --port 8003"
    environment:
      OPENAPI_MCP_HEADERS: '{"Authorization":"Bearer ${NOTION_TOKEN:-}","Notion-Version":"2022-06-28"}'
      MCP_TRANSPORT: sse
      MCP_PORT: 8003
    ports:
      - "8003:8003"
    networks:
      - aiden_network
    restart: unless-stopped

  github-mcp:
    image: node:20-alpine
    container_name: aiden_github_mcp
    command: >
      sh -c "npx -y @modelcontextprotocol/server-github --port 8004"
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN:-}
      MCP_TRANSPORT: sse
      MCP_PORT: 8004
    ports:
      - "8004:8004"
    networks:
      - aiden_network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  mongo_data:
    driver: local
  chroma_data:
    driver: local

networks:
  aiden_network:
    driver: bridge
